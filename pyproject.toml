[project]
name = "itinerario-bot"
version = "0.1.0"
description = "Investigación y recorridos con informes cartográficos desde Telegram"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "httpx==0.28.1",
    "pydantic>=2.11,<3",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.1,<2",
    "reportlab>=4.4,<5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
itinerario = "itinerario.__main__:main"

[tool.setuptools.packages.find]
include = ["itinerario*"]

[tool.ruff]
target-version = "py312"
line-length = 110
